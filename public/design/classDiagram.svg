<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 886" width="1030" height="886"
     role="img" aria-labelledby="cd-title cd-desc">
    <title id="cd-title">Class Diagram — Aplikasi Login Multi Role</title>
    <desc id="cd-desc">Class diagram Laravel 12: User, Authenticatable, Controller, AuthController,
        DashboardController, UserController, RoleMiddleware, dan UserFactory.</desc>

    <style>
        .box        { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.6; }
        .head       { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.6; }
        .model-box  { fill: #ffffff; stroke: #3b6fd4; stroke-width: 2; }
        .model-head { fill: #eef4ff; stroke: #3b6fd4; stroke-width: 2; }
        .base-box   { fill: #f8fafc; stroke: #334155; stroke-width: 1.6; }
        .base-head  { fill: #e2e8f0; stroke: #334155; stroke-width: 1.6; }
        .sep        { stroke: #cbd5e1; stroke-width: 1; }
        .name       { fill: #0f172a; font-size: 11px; font-weight: 700; text-anchor: middle; }
        .model-name { fill: #16294f; font-size: 12px; font-weight: 700; text-anchor: middle; }
        .stereo     { fill: #475569; font-size: 8px; text-anchor: middle; }
        .member     { fill: #1e293b; font-size: 9px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
        .note       { fill: #94a3b8; font-size: 9px; font-style: italic; }
        .dep        { stroke: #64748b; stroke-width: 1.3; fill: none; stroke-dasharray: 6 4; }
        .inh        { stroke: #334155; stroke-width: 1.6; fill: none; }
        .lbl        { fill: #475569; font-size: 8px; }
        .title      { fill: #16294f; font-size: 13px; font-weight: 700; }
        .subtitle   { fill: #64748b; font-size: 9px; }
    </style>

    <defs>
        <marker id="dep" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9"
                orient="auto-start-reverse">
            <path d="M0,0 L12,6 L0,12" fill="none" stroke="#64748b" stroke-width="1.4"/>
        </marker>
        <marker id="inh" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="12" markerHeight="12"
                orient="auto-start-reverse">
            <path d="M0,0 L14,7 L0,14 z" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
        </marker>
    </defs>

    <rect x="0" y="0" width="1030" height="886" fill="#ffffff"/>

    <!-- ===================== HEADER ===================== -->
    <text x="40" y="26" class="title">Class Diagram — Aplikasi Login Multi Role</text>
    <text x="40" y="40" class="subtitle">Laravel 12 · App\Models · App\Http\Controllers · App\Http\Middleware · Database\Factories</text>

    <!-- ===================== CONTROLLER (abstract) ===================== -->
    <rect x="380" y="60" width="280" height="70" class="base-box"/>
    <rect x="380" y="60" width="280" height="34" class="base-head"/>
    <text x="520" y="77" class="name">Controller</text>
    <text x="520" y="89" class="stereo">«abstract»</text>
    <line x1="380" y1="94" x2="660" y2="94" class="sep"/>
    <text x="388" y="112" class="note">tidak ada anggota (base class)</text>

    <!-- ===================== AUTHCONTROLLER ===================== -->
    <rect x="40" y="210" width="290" height="154" class="box"/>
    <rect x="40" y="210" width="290" height="34" class="head"/>
    <text x="185" y="227" class="name">AuthController</text>
    <text x="185" y="239" class="stereo">«controller»</text>
    <line x1="40" y1="244" x2="330" y2="244" class="sep"/>
    <g class="member">
        <text x="48" y="264">+ showLogin() : View</text>
        <text x="48" y="282">+ login(Request) : RedirectResponse</text>
        <text x="48" y="300">+ showRegister() : View</text>
        <text x="48" y="318">+ register(Request) : RedirectResponse</text>
        <text x="48" y="336">+ logout(Request) : RedirectResponse</text>
    </g>

    <!-- ===================== DASHBOARDCONTROLLER ===================== -->
    <rect x="360" y="210" width="270" height="120" class="box"/>
    <rect x="360" y="210" width="270" height="34" class="head"/>
    <text x="495" y="227" class="name">DashboardController</text>
    <text x="495" y="239" class="stereo">«controller»</text>
    <line x1="360" y1="244" x2="630" y2="244" class="sep"/>
    <g class="member">
        <text x="368" y="264">+ admin() : View</text>
        <text x="368" y="282">+ customer() : View</text>
    </g>

    <!-- ===================== USERCONTROLLER ===================== -->
    <rect x="660" y="210" width="330" height="154" class="box"/>
    <rect x="660" y="210" width="330" height="34" class="head"/>
    <text x="825" y="227" class="name">UserController</text>
    <text x="825" y="239" class="stereo">«controller»</text>
    <line x1="660" y1="244" x2="990" y2="244" class="sep"/>
    <g class="member">
        <text x="668" y="264">+ index() : View</text>
        <text x="668" y="282">+ store(Request) : RedirectResponse</text>
        <text x="668" y="300">+ update(Request, User) : RedirectResponse</text>
        <text x="668" y="318">+ destroy(Request, User) : RedirectResponse</text>
    </g>

    <!-- ===================== ROLE MIDDLEWARE ===================== -->
    <rect x="660" y="424" width="330" height="104" class="box"/>
    <rect x="660" y="424" width="330" height="34" class="head"/>
    <text x="825" y="441" class="name">RoleMiddleware</text>
    <text x="825" y="453" class="stereo">«middleware»</text>
    <line x1="660" y1="458" x2="990" y2="458" class="sep"/>
    <g class="member">
        <text x="668" y="478">+ handle(Request, Closure, ...roles)</text>
        <text x="684" y="496">: Response</text>
    </g>

    <!-- ===================== USER (model) ===================== -->
    <rect x="200" y="424" width="330" height="296" class="model-box"/>
    <rect x="200" y="424" width="330" height="34" class="model-head"/>
    <text x="365" y="441" class="model-name">User</text>
    <text x="365" y="453" class="stereo">«model»</text>
    <line x1="200" y1="458" x2="530" y2="458" class="sep"/>
    <g class="member">
        <text x="208" y="478">- id : bigint</text>
        <text x="208" y="494">- name : string</text>
        <text x="208" y="510">- email : string</text>
        <text x="208" y="526">- password : string</text>
        <text x="208" y="542">- role : string</text>
        <text x="208" y="558">- email_verified_at : datetime</text>
        <text x="208" y="574">- remember_token : string</text>
        <text x="208" y="590">- created_at : datetime</text>
        <text x="208" y="606">- updated_at : datetime</text>
    </g>
    <line x1="200" y1="618" x2="530" y2="618" class="sep"/>
    <g class="member">
        <text x="208" y="636" text-decoration="underline">+ ROLE_ADMIN = 'admin'</text>
        <text x="208" y="652" text-decoration="underline">+ ROLE_CUSTOMER = 'customer'</text>
    </g>
    <line x1="200" y1="664" x2="530" y2="664" class="sep"/>
    <g class="member">
        <text x="208" y="682">+ isAdmin() : bool</text>
        <text x="208" y="698">+ isCustomer() : bool</text>
    </g>

    <!-- ===================== AUTHENTICATABLE ===================== -->
    <rect x="200" y="750" width="330" height="106" class="base-box"/>
    <rect x="200" y="750" width="330" height="34" class="base-head"/>
    <text x="365" y="767" class="name">Authenticatable</text>
    <text x="365" y="779" class="stereo">«abstract · Laravel»</text>
    <line x1="200" y1="784" x2="530" y2="784" class="sep"/>
    <g class="member">
        <text x="208" y="804"># guard_name : string</text>
        <text x="208" y="820">+ getAuthIdentifier() : mixed</text>
        <text x="208" y="836">+ getAuthPassword() : string</text>
    </g>

    <!-- ===================== USER FACTORY ===================== -->
    <rect x="660" y="580" width="330" height="138" class="box"/>
    <rect x="660" y="580" width="330" height="34" class="head"/>
    <text x="825" y="597" class="name">UserFactory</text>
    <text x="825" y="609" class="stereo">«factory»</text>
    <line x1="660" y1="614" x2="990" y2="614" class="sep"/>
    <text x="668" y="634" class="member"># password : ?string (static)</text>
    <line x1="660" y1="646" x2="990" y2="646" class="sep"/>
    <g class="member">
        <text x="668" y="666">+ definition() : array</text>
        <text x="668" y="684">+ admin() : static</text>
        <text x="668" y="702">+ unverified() : static</text>
    </g>

    <!-- ===================== INHERITANCE ===================== -->
    <polyline points="185,210 185,95 380,95" class="inh" marker-end="url(#inh)"/>
    <line x1="495" y1="210" x2="495" y2="130" class="inh" marker-end="url(#inh)"/>
    <polyline points="825,210 825,95 660,95" class="inh" marker-end="url(#inh)"/>
    <line x1="365" y1="720" x2="365" y2="750" class="inh" marker-end="url(#inh)"/>

    <!-- ===================== DEPENDENCIES ===================== -->
    <polyline points="185,364 185,404 258,404 258,424" class="dep" marker-end="url(#dep)"/>
    <polyline points="495,330 495,350 400,350 400,424" class="dep" marker-end="url(#dep)"/>
    <polyline points="825,364 825,404 481,404 481,424" class="dep" marker-end="url(#dep)"/>
    <line x1="660" y1="476" x2="530" y2="476" class="dep" marker-end="url(#dep)"/>
    <line x1="660" y1="649" x2="530" y2="649" class="dep" marker-end="url(#dep)"/>

    <g class="lbl">
        <text x="194" y="400">«use»</text>
        <text x="430" y="344">«use»</text>
        <text x="700" y="400">«use»</text>
        <text x="545" y="469">«melindungi»</text>
        <text x="545" y="642">«create»</text>
    </g>

    <!-- ===================== LEGEND ===================== -->
    <rect x="660" y="750" width="330" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
    <text x="674" y="772" fill="#334155" font-size="10" font-weight="700">Legenda</text>
    <line x1="674" y1="790" x2="724" y2="790" stroke="#334155" stroke-width="1.6" marker-end="url(#inh)"/>
    <text x="734" y="794" fill="#475569" font-size="9">inheritance (extends)</text>
    <line x1="674" y1="812" x2="724" y2="812" stroke="#64748b" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#dep)"/>
    <text x="734" y="816" fill="#475569" font-size="9">dependency (memakai / membuat)</text>
    <text x="674" y="836" fill="#475569" font-size="9">- private   # protected   + public</text>
    <text x="674" y="850" fill="#475569" font-size="9">teks bergaris bawah = konstanta (static)</text>
</svg>
