<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720"
     role="img" aria-labelledby="chen-title chen-desc">
    <title id="chen-title">ERD Notasi Chen — Aplikasi Login Multi Role</title>
    <desc id="chen-desc">Model konseptual: entitas USER, SESSION, PASSWORD_RESET_TOKENS beserta
        atribut dan relasinya.</desc>

    <style>
        .ent     { fill: #eef4ff; stroke: #3b6fd4; stroke-width: 2; }
        .ent-t   { fill: #16294f; font-size: 12px; font-weight: 700; text-anchor: middle; }
        .ent-s   { fill: #64748b; font-size: 8px; text-anchor: middle; }
        .attr    { fill: #ffffff; stroke: #64748b; stroke-width: 1.3; }
        .attr-t  { fill: #1e293b; font-size: 9px; text-anchor: middle;
                   font-family: ui-monospace, Consolas, monospace; }
        .rel     { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
        .rel-t   { fill: #78350f; font-size: 10px; font-weight: 700; text-anchor: middle; }
        .line    { stroke: #475569; stroke-width: 1.3; fill: none; }
        .card    { fill: #334155; font-size: 11px; font-weight: 700; }
        .h       { fill: #16294f; font-size: 14px; font-weight: 700; }
        .sub     { fill: #64748b; font-size: 9px; }
        .sect    { fill: #334155; font-size: 11px; font-weight: 700; }
        .note    { fill: #475569; font-size: 9px; }
    </style>

    <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>

    <!-- ================= HEADER ================= -->
    <text x="40" y="30" class="h">ERD — Notasi Chen</text>
    <text x="40" y="46" class="sub">Aplikasi Login Multi Role · model konseptual: entitas, atribut, dan relasi</text>

    <!-- ================= ENTITIES ================= -->
    <!-- SESSION -->
    <rect x="60" y="90" width="150" height="50" class="ent"/>
    <text x="135" y="112" class="ent-t">SESSION</text>
    <text x="135" y="128" class="ent-s">tabel sessions</text>

    <!-- USER -->
    <rect x="390" y="90" width="150" height="50" class="ent"/>
    <text x="465" y="112" class="ent-t">USER</text>
    <text x="465" y="128" class="ent-s">tabel users</text>

    <!-- PASSWORD_RESET_TOKENS -->
    <rect x="700" y="90" width="300" height="50" class="ent"/>
    <text x="850" y="112" class="ent-t">PASSWORD_RESET_TOKENS</text>
    <text x="850" y="128" class="ent-s">tabel password_reset_tokens</text>

    <!-- ================= RELATION 1: memiliki ================= -->
    <line x1="210" y1="115" x2="270" y2="115" class="line"/>
    <polygon points="270,115 300,92 330,115 300,138" class="rel"/>
    <text x="300" y="119" class="rel-t">memiliki</text>
    <line x1="330" y1="115" x2="390" y2="115" class="line"/>
    <text x="236" y="107" class="card">N</text>
    <text x="350" y="107" class="card">1</text>

    <!-- ================= RELATION 2: meminta ================= -->
    <line x1="540" y1="115" x2="590" y2="115" class="line"/>
    <polygon points="590,115 620,92 650,115 620,138" class="rel"/>
    <text x="620" y="119" class="rel-t">meminta</text>
    <line x1="650" y1="115" x2="700" y2="115" class="line"/>
    <text x="566" y="107" class="card">1</text>
    <text x="670" y="107" class="card">1</text>

    <!-- ================= ATRIBUT SESSION ================= -->
    <line x1="120" y1="140" x2="112" y2="174" class="line"/>
    <ellipse cx="110" cy="194" rx="64" ry="20" class="attr"/>
    <text x="110" y="198" class="attr-t" text-decoration="underline">id_session</text>

    <line x1="150" y1="140" x2="238" y2="174" class="line"/>
    <ellipse cx="245" cy="194" rx="60" ry="20" class="attr"/>
    <text x="245" y="198" class="attr-t">user_id</text>

    <line x1="120" y1="140" x2="112" y2="244" class="line"/>
    <ellipse cx="110" cy="264" rx="64" ry="20" class="attr"/>
    <text x="110" y="268" class="attr-t">ip_address</text>

    <line x1="155" y1="140" x2="245" y2="244" class="line"/>
    <ellipse cx="252" cy="264" rx="68" ry="20" class="attr"/>
    <text x="252" y="268" class="attr-t">last_activity</text>

    <!-- ================= ATRIBUT USER ================= -->
    <line x1="420" y1="140" x2="400" y2="174" class="line"/>
    <ellipse cx="398" cy="194" rx="58" ry="20" class="attr"/>
    <text x="398" y="198" class="attr-t" text-decoration="underline">id_user</text>

    <line x1="450" y1="140" x2="478" y2="174" class="line"/>
    <ellipse cx="482" cy="194" rx="52" ry="20" class="attr"/>
    <text x="482" y="198" class="attr-t">nama</text>

    <line x1="490" y1="140" x2="562" y2="174" class="line"/>
    <ellipse cx="570" cy="194" rx="54" ry="20" class="attr"/>
    <text x="570" y="198" class="attr-t">email</text>

    <line x1="425" y1="140" x2="418" y2="244" class="line"/>
    <ellipse cx="415" cy="264" rx="62" ry="20" class="attr"/>
    <text x="415" y="268" class="attr-t">password</text>

    <line x1="500" y1="140" x2="538" y2="244" class="line"/>
    <ellipse cx="548" cy="264" rx="54" ry="20" class="attr"/>
    <text x="548" y="268" class="attr-t">role</text>

    <!-- ================= ATRIBUT PASSWORD_RESET_TOKENS ================= -->
    <line x1="740" y1="140" x2="712" y2="174" class="line"/>
    <ellipse cx="708" cy="194" rx="56" ry="20" class="attr"/>
    <text x="708" y="198" class="attr-t" text-decoration="underline">email</text>

    <line x1="820" y1="140" x2="842" y2="174" class="line"/>
    <ellipse cx="845" cy="194" rx="52" ry="20" class="attr"/>
    <text x="845" y="198" class="attr-t">token</text>

    <line x1="900" y1="140" x2="975" y2="174" class="line"/>
    <ellipse cx="985" cy="194" rx="60" ry="20" class="attr"/>
    <text x="985" y="198" class="attr-t">created_at</text>

    <!-- ================= CATATAN ================= -->
    <text x="40" y="352" class="sect">Keterangan</text>

    <rect x="40" y="368" width="380" height="112" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
    <text x="54" y="390" class="note" font-weight="700" fill="#334155">USER — SESSION (1 : N)</text>
    <text x="54" y="410" class="note">Satu user dapat memiliki banyak session aktif</text>
    <text x="54" y="426" class="note">(login di beberapa perangkat sekaligus).</text>
    <text x="54" y="446" class="note">Kolom sessions.user_id boleh kosong untuk</text>
    <text x="54" y="462" class="note">session tamu yang belum login.</text>

    <rect x="450" y="368" width="390" height="112" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
    <text x="464" y="390" class="note" font-weight="700" fill="#334155">USER — PASSWORD_RESET_TOKENS (1 : 1)</text>
    <text x="464" y="410" class="note">Satu user memiliki paling banyak satu token</text>
    <text x="464" y="426" class="note">reset password aktif pada satu waktu.</text>
    <text x="464" y="446" class="note">Dikaitkan lewat kolom email, bukan user_id —</text>
    <text x="464" y="462" class="note">relasi konseptual tanpa constraint fisik.</text>

    <rect x="40" y="500" width="800" height="104" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
    <text x="54" y="522" class="note" font-weight="700" fill="#334155">Tabel framework Laravel</text>
    <text x="54" y="542" class="note">cache · cache_locks · jobs · job_batches · failed_jobs — dibuat otomatis oleh migration.</text>
    <text x="54" y="560" class="note">Tabel ini melayani cache aplikasi dan antrian job, bukan bagian dari domain autentikasi,</text>
    <text x="54" y="576" class="note">sehingga tidak memiliki relasi ke tabel users maupun sessions.</text>

    <!-- ================= LEGENDA ================= -->
    <rect x="860" y="352" width="300" height="140" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
    <text x="874" y="374" class="note" font-weight="700" fill="#334155">Legenda notasi Chen</text>

    <rect x="874" y="386" width="40" height="20" class="ent"/>
    <text x="924" y="400" class="note">Entitas</text>

    <ellipse cx="894" cy="428" rx="26" ry="12" class="attr"/>
    <text x="930" y="432" class="note">Atribut</text>

    <polygon points="874,452 894,440 914,452 894,464" class="rel"/>
    <text x="930" y="456" class="note">Relasi</text>

    <text x="874" y="482" class="note">garis bawah = primary key</text>
</svg>
